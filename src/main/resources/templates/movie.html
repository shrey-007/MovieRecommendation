<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${currentMovie.title} + ' — CineMatch'">Movie — CineMatch</title>
    <meta name="description" th:content="${currentMovie.overview}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/movie.css}">
</head>
<body>

<!-- Back Navigation -->
<div class="back-nav">
    <a href="/dashboard" class="btn-ghost">← Back to Dashboard</a>
</div>

<!-- Movie Hero Section -->
<div class="movie-hero">
    <h1 class="movie-title gradient-text" th:text="${currentMovie.title}"></h1>

    <!-- Video Player -->
    <div class="video-container">
        <video id="moviePlayer" controls>
            <source src="/api/v1/videos/stream/range" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Movie Overview -->
    <div class="movie-overview" th:text="${currentMovie.overview}"></div>
</div>

<!-- Hidden form for watch tracking -->
<form id="watchForm" action="/movies/updateWatchList" method="get" style="display:none;">
    <input type="hidden" name="title" th:value="${currentMovie.title}">
</form>

<!-- Similar Movies Section -->
<div class="similar-section">
    <h2 class="section-heading">Similar Movies</h2>
    <div id="movieContent" class="movies-grid">
        <!-- Loading placeholders -->
        <div class="loading-placeholder"></div>
        <div class="loading-placeholder"></div>
        <div class="loading-placeholder"></div>
    </div>
</div>

<!--To pass to javascript-->
<input type="hidden" id="hiddenRequestId" th:value="${requestId}"/>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function() {
    var requestId = document.getElementById('hiddenRequestId').value;
    console.log("Request ID: ", requestId);

    // Function to check movie recommendations
    function checkRecommendations() {
        $.ajax({
            url: '/movie/status',
            method: 'GET',
            data: { requestId: requestId },
            success: function(data) {
                if (data && data.length > 0) {
                    // Clear the existing content
                    $('#movieContent').empty();

                    // Iterate over the returned movie data and display it
                    data.forEach(function(movie) {
                        $('#movieContent').append(
                            `<a href="/movies/movie?title=${encodeURIComponent(movie.title)}" class="card-link">
                                <div class="card">
                                    <div class="card-body">
                                        <h5 class="card-title">${movie.title}</h5>
                                        <p class="card-text">${movie.overview}</p>
                                        <div class="card-footer-accent">
                                            <span>▸</span> View details
                                        </div>
                                    </div>
                                </div>
                            </a>`
                        );
                    });
                } else {
                    // Retry after 2 seconds
                    setTimeout(checkRecommendations, 2000);
                }
            },
            error: function() {
                console.error("Error occurred while fetching movie recommendations.");
            }
        });
    }

    // Start checking for recommendations
    checkRecommendations();

    // For the async request to the controller to save that the user has watched the movie
    const video = document.getElementById('moviePlayer');
    const form = document.getElementById('watchForm');
    let hasWatched90Percent = false;

    if (video) {
        console.log("Video element found");
        video.addEventListener('timeupdate', function() {
            const percentageWatched = (video.currentTime / video.duration) * 100;

            if (!hasWatched90Percent && percentageWatched >= 90) {
                hasWatched90Percent = true;
                console.log("Reached 90%, sending async request");

                const movieTitle = document.querySelector('input[name="title"]').value;
                const url = `/movies/updateWatchList?title=${encodeURIComponent(movieTitle)}`;

                fetch(url, { method: 'GET' })
                .then(response => {
                    if (response.ok) {
                        console.log('Movie watchlist updated successfully');
                    } else {
                        console.error('Failed to update watchlist');
                    }
                })
                .catch(error => console.error('Error:', error));
            }
        });
    } else {
        console.error("Video element not found!");
    }
});
</script>

</body>
</html>
