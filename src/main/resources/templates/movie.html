<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${currentMovie.title} + ' — CineMatch'">Movie — CineMatch</title>
    <meta name="description" th:content="${currentMovie.overview}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/movie.css}">
</head>
<body>

<!-- Back Navigation -->
<div class="back-nav">
    <a href="/dashboard" class="btn-ghost">← Back to Dashboard</a>
</div>

<!-- Movie Hero Section -->
<div class="movie-hero">
    <h1 class="movie-title gradient-text" th:text="${currentMovie.title}"></h1>

    <!-- Video Player -->
    <div class="video-container">
        <!-- Buffering Overlay -->
        <div id="bufferingOverlay" class="buffering-overlay">
            <div class="buffering-content">
                <div class="buffering-spinner"></div>
                <p class="buffering-text">Preparing stream<span class="loading-dots"></span></p>
                <p id="bufferingStatus" class="buffering-status">Finding torrent sources...</p>
            </div>
        </div>
        <video id="moviePlayer" controls preload="none">
            <source id="videoSource" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Movie Overview -->
    <div class="movie-overview" th:text="${currentMovie.overview}"></div>
</div>

<!-- Hidden form for watch tracking -->
<form id="watchForm" action="/movies/updateWatchList" method="get" style="display:none;">
    <input type="hidden" name="title" th:value="${currentMovie.title}">
</form>

<!-- Hidden field for movie title (used by JS) -->
<input type="hidden" id="hiddenMovieTitle" th:value="${currentMovie.title}"/>

<!-- Similar Movies Section -->
<div class="similar-section">
    <h2 class="section-heading">Similar Movies</h2>
    <div id="movieContent" class="movies-grid">
        <!-- Loading placeholders -->
        <div class="loading-placeholder"></div>
        <div class="loading-placeholder"></div>
        <div class="loading-placeholder"></div>
    </div>
</div>

<!--To pass to javascript-->
<input type="hidden" id="hiddenRequestId" th:value="${requestId}"/>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function() {
    var requestId = document.getElementById('hiddenRequestId').value;
    var movieTitle = document.getElementById('hiddenMovieTitle').value;
    console.log("Request ID: ", requestId);
    console.log("Movie Title: ", movieTitle);

    // ========== TORRENT STREAMING LOGIC ==========

    const video = document.getElementById('moviePlayer');
    const videoSource = document.getElementById('videoSource');
    const overlay = document.getElementById('bufferingOverlay');
    const statusText = document.getElementById('bufferingStatus');

    // Step 1: Prepare the stream (start torrent resolution in background)
    function prepareStream() {
        statusText.textContent = 'Finding torrent sources...';

        $.ajax({
            url: '/api/v1/videos/stream/prepare',
            method: 'POST',
            data: { title: movieTitle },
            success: function(data) {
                if (data.success) {
                    statusText.textContent = 'Torrent found! Buffering...';
                    console.log("Torrent preparation started:", data.infoHash);
                    // Start polling for readiness
                    pollStreamStatus();
                } else {
                    statusText.textContent = 'Could not find torrent: ' + data.message;
                    console.error("Failed to prepare stream:", data.message);
                }
            },
            error: function(xhr, status, error) {
                statusText.textContent = 'Error preparing stream. Please try again.';
                console.error("Error preparing stream:", error);
            }
        });
    }

    // Step 2: Poll for stream readiness
    var pollCount = 0;
    function pollStreamStatus() {
        $.ajax({
            url: '/api/v1/videos/stream/status',
            method: 'GET',
            data: { title: movieTitle },
            success: function(data) {
                console.log("Stream status:", data);
                pollCount++;

                if (data.ready) {
                    statusText.textContent = 'Stream ready! Starting playback...';
                    console.log("Stream is ready!");
                    // Set the video source and start playback
                    startPlayback();
                } else {
                    statusText.textContent = 'Buffering... ' + (data.progress || '');
                    // Continue polling every 3 seconds
                    if (pollCount < 100) { // Max 5 minutes of polling
                        setTimeout(pollStreamStatus, 3000);
                    } else {
                        statusText.textContent = 'Buffering taking too long. Try playing anyway.';
                        startPlayback();
                    }
                }
            },
            error: function() {
                if (pollCount < 100) {
                    setTimeout(pollStreamStatus, 3000);
                }
            }
        });
    }

    // Step 3: Set video source and start playback
    function startPlayback() {
        var streamUrl = '/api/v1/videos/stream/range?title=' + encodeURIComponent(movieTitle);
        videoSource.src = streamUrl;
        video.load();

        // Hide overlay once video can play
        video.addEventListener('canplay', function() {
            overlay.style.display = 'none';
            video.play().catch(function(e) {
                console.log("Auto-play prevented:", e);
            });
        }, { once: true });

        // Show overlay again if buffering stalls
        video.addEventListener('waiting', function() {
            overlay.style.display = 'flex';
            statusText.textContent = 'Buffering...';
        });

        video.addEventListener('playing', function() {
            overlay.style.display = 'none';
        });

        // Handle errors
        video.addEventListener('error', function(e) {
            console.error("Video error:", e);
            statusText.textContent = 'Playback error. The torrent may still be loading.';
            overlay.style.display = 'flex';
            // Retry after a delay
            setTimeout(function() {
                statusText.textContent = 'Retrying...';
                video.load();
            }, 5000);
        });

        // Fallback: hide overlay after 10 seconds even if canplay doesn't fire
        setTimeout(function() {
            if (overlay.style.display !== 'none') {
                overlay.style.display = 'none';
            }
        }, 10000);
    }

    // Start the streaming pipeline
    prepareStream();

    // ========== SIMILAR MOVIES LOGIC ==========

    // Function to check movie recommendations
    function checkRecommendations() {
        $.ajax({
            url: '/movie/status',
            method: 'GET',
            data: { requestId: requestId },
            success: function(data) {
                if (data && data.length > 0) {
                    // Clear the existing content
                    $('#movieContent').empty();

                    // Iterate over the returned movie data and display it
                    data.forEach(function(movie) {
                        $('#movieContent').append(
                            `<a href="/movies/movie?title=${encodeURIComponent(movie.title)}" class="card-link">
                                <div class="card">
                                    <div class="card-body">
                                        <h5 class="card-title">${movie.title}</h5>
                                        <p class="card-text">${movie.overview}</p>
                                        <div class="card-footer-accent">
                                            <span>▸</span> View details
                                        </div>
                                    </div>
                                </div>
                            </a>`
                        );
                    });
                } else {
                    // Retry after 2 seconds
                    setTimeout(checkRecommendations, 2000);
                }
            },
            error: function() {
                console.error("Error occurred while fetching movie recommendations.");
            }
        });
    }

    // Start checking for recommendations
    checkRecommendations();

    // ========== WATCH TRACKING ==========

    const form = document.getElementById('watchForm');
    let hasWatched90Percent = false;

    if (video) {
        console.log("Video element found");
        video.addEventListener('timeupdate', function() {
            const percentageWatched = (video.currentTime / video.duration) * 100;

            if (!hasWatched90Percent && percentageWatched >= 90) {
                hasWatched90Percent = true;
                console.log("Reached 90%, sending async request");

                const movieTitleVal = document.querySelector('input[name="title"]').value;
                const url = `/movies/updateWatchList?title=${encodeURIComponent(movieTitleVal)}`;

                fetch(url, { method: 'GET' })
                .then(response => {
                    if (response.ok) {
                        console.log('Movie watchlist updated successfully');
                    } else {
                        console.error('Failed to update watchlist');
                    }
                })
                .catch(error => console.error('Error:', error));
            }
        });
    } else {
        console.error("Video element not found!");
    }
});
</script>

</body>
</html>
