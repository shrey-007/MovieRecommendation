<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch — Movie Recommendations</title>
    <meta name="description" content="Get personalized movie recommendations powered by AI.">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .hero-container {
            text-align: center;
            padding: 48px 40px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            max-width: 440px;
            width: 100%;
            animation: fadeInUp 0.6s ease forwards;
            position: relative;
            overflow: hidden;
        }

        /* Decorative glow */
        .hero-container::before {
            content: '';
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            display: block;
        }

        .hero-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .hero-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 36px;
            line-height: 1.5;
        }

        .hero-actions {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
    </style>
</head>
<body>

<div class="hero-container">
    <span class="hero-icon">🎬</span>
    <h1 class="hero-title gradient-text">CineMatch</h1>
    <p class="hero-subtitle">Discover your next favorite movie with AI-powered recommendations</p>
    <div class="hero-actions">
        <a href="/login" class="btn-accent">Sign In</a>
        <a href="/register" class="btn-ghost">Create Account</a>
    </div>
</div>

</body>
</html>
