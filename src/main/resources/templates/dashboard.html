<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — CineMatch</title>
    <meta name="description" content="Browse and discover movies with personalized recommendations.">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <a href="/dashboard" class="navbar-brand gradient-text">🎬 CineMatch</a>
    <div class="search-container">
        <!--onkeyup is a javascript event, as soon as the user types in the search bar, the search function is called-->
        <input onkeyup="search()" id="search-input" type="text" placeholder="Search movies...">
        <div class="search-result">
            <!--this is search result-->
        </div>
    </div>
</nav>

<!-- Page Content -->
<div class="page-content">
    <h2 class="section-heading">Discover Movies</h2>
    <div class="movies-grid">
        <!-- Iterate over movieList -->
        <a th:each="movie : ${moviesList}" th:href="@{/movies/movie(title=${movie.title})}" class="card-link">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${movie.title}">Movie Title</h5>
                    <p class="card-text" th:text="${movie.overview}">Movie Overview</p>
                    <div class="card-footer-accent">
                        <span>▸</span> View details
                    </div>
                </div>
            </div>
        </a>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
